name: Swift

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve packages
        run: swift package resolve

      - name: Run package tests
        run: swift test

      - name: Validate release metadata
        run: |
          plutil -lint BaiduFMApp/Info.plist
          plutil -lint Sources/BaiduFM/PrivacyInfo.xcprivacy
          if rg --line-number 'http://' Sources/BaiduFM --glob '*.swift'; then
            echo "Insecure HTTP URL found in Swift sources."
            exit 1
          fi

      - name: Build application for iOS Simulator
        run: >-
          xcodebuild
          -project BaiduFM.xcodeproj
          -scheme BaiduFMApp
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
